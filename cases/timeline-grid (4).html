<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>График выхода фисей</title>
  <style>
    :root {
      --bg-outer: #23262b;
      --bg-card: #f0f2f6;
      --line-color: #c7cbd3;
      --label-color: #9aa0ab;
      --title-color: #b9bec7;

      /* Неравные, но пропорциональные колонки */
      --col-1: 3fr;
      --col-2: 2fr;
      --col-3: 1fr;

      --bar-min-height: 44px;
      /* минимальная высота плашки, если текста мало */
      --bar-overhang: 10px;
      /* насколько плашка выходит за края своей колонки */
      --bar-gap: 56px;
      /* расстояние между плашками по вертикали (глубина) */
      --bar-padding: 14px 20px;
      /* внутренние отступы под текст */
    }

    * {
      box-sizing: border-box;
        margin: 0;
  padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-outer);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 1240px;
      background: var(--bg-card);
      border-radius: 28px;
      padding: 32px clamp(20px, 4vw, 48px) 40px;
    }

    .card__title {
      color: var(--title-color);
      font-size: 13px;
      letter-spacing: 0.02em;
      margin: 0 0 28px;
    }

    /* Строка теперь не фиксированной высоты (auto), потому что высоту
     задаёт содержимое самой высокой плашки в этой строке */
    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: var(--col-1) var(--col-2) var(--col-3);
      grid-auto-rows: auto;
      row-gap: 28px;
      padding-top: 10px;
    }

    .grid-line {
      grid-row: 1 / span 3;
      position: relative;
      border-left: 1px solid var(--line-color);
      height: 100%;
      z-index: 1;
    }

    .grid-line::after {
      content: attr(data-label);
      position: absolute;
      left: 0;
      bottom: -28px;
      transform: translateX(-2px);
      font-size: 14px;
      color: var(--label-color);
    }

    /* Слот теперь тоже auto-высоты: его высота равна высоте .bar внутри,
     плюс запас на смещение bar-gap, чтобы соседний слот не перекрывал текст */
    .bar-slot {
      grid-row: 2;
      position: relative;
      padding-bottom: var(--bar-gap);
    }

    .bar {
      position: relative;
      left: calc(-1 * var(--bar-overhang));
      right: calc(-1 * var(--bar-overhang));
      width: calc(100% + var(--bar-overhang) * 2);
      min-height: var(--bar-min-height);
      padding: var(--bar-padding);
      border-radius: 22px;
      overflow: hidden;
      /* box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12); */
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
    }

    .bar-slot--red {
      grid-column: 1 / span 3;
      z-index: 3;
    }

    .bar-slot--red .bar {
      top: calc(-1 * var(--bar-gap) / 2);
      background: linear-gradient(90deg,
          #d4001c 0%,
          #f2306a 45%,
          rgba(242, 48, 106, 0.15) 85%,
          rgba(242, 48, 106, 0) 100%);
    }

    .bar-slot--orange {
      grid-column: 2 / span 1;
      z-index: 2;
    }

    .bar-slot--orange .bar {
      top: calc(var(--bar-gap) / 2);
      background:
        linear-gradient(90deg, rgba(184, 46, 10, 0.55), rgba(184, 46, 10, 0.15)),
        url('https://images.unsplash.com/photo-1611080626919-7cf5a9dfa5e6?w=600&q=60') center/cover;
      background-blend-mode: multiply;
    }

  </style>
</head>

<body>

  <div class="card">
    <p class="card__title">2 график выхода фисей</p>

    <div class="timeline">
      <div class="grid-line" style="grid-column: 1;" data-label="15.12"></div>
      <div class="grid-line" style="grid-column: 2;" data-label="23.12"></div>
      <div class="grid-line" style="grid-column: 3;" data-label="30.12"></div>

      <div class="bar-slot bar-slot--red">
        <div class="bar">
          <p>skdmcsk</p>
          <p>las,dclap,</p>
        </div>
      </div>
      <div class="bar-slot bar-slot--orange">
        <div class="bar">Вторая волна</div>
      </div>
    </div>
  </div>

</body>
